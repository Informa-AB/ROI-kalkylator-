<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Informa ROI-kalkylator</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='60' fill='%231E1B19'/%3E%3Ctext x='56' y='64' dominant-baseline='central' text-anchor='middle' font-family='Georgia,serif' font-size='66' fill='%23F1ECE3'%3EI%3C/text%3E%3Ccircle cx='82' cy='85' r='7' fill='%23FA7896'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #F1ECE3;
      color: #1A1916;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Slider */
    .informa-slider {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px;
      border-radius: 2px; outline: none;
      cursor: pointer; display: block;
    }
    .informa-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      background: #E85B7D; cursor: pointer;
      border: 2px solid #F1ECE3;
      transition: transform 0.1s;
    }
    .informa-slider::-webkit-slider-thumb:active { transform: scale(1.15); }
    .informa-slider::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%;
      background: #E85B7D; cursor: pointer;
      border: 2px solid #F1ECE3;
    }
    .informa-slider::-moz-range-track  { height: 4px; border-radius: 2px; background: #DFD8CB; }
    .informa-slider::-moz-range-progress { height: 4px; border-radius: 2px 0 0 2px; background: #E85B7D; }

    /* Number input – remove spinners */
    .no-spin::-webkit-inner-spin-button,
    .no-spin::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .no-spin { -moz-appearance: textfield; }

    /* Focus */
    input:focus, select:focus {
      border-color: #E85B7D !important;
      outline: none;
    }

    /* Animations */
    @keyframes fadeUp   { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pinShake {
      0%,100% { transform:translateX(0); }
      15%  { transform:translateX(-9px); }  30%  { transform:translateX(8px); }
      45%  { transform:translateX(-6px); }  60%  { transform:translateX(5px); }
      75%  { transform:translateX(-3px); }  90%  { transform:translateX(2px); }
    }
    .tab-in { animation: fadeUp 0.3s ease both; }

    /* Toast */
    @keyframes toastIn  { from { opacity:0; transform:translateY(16px) scale(0.96); } to { opacity:1; transform:none; } }
    @keyframes toastOut { from { opacity:1; } to { opacity:0; transform:translateY(8px); } }
    .toast     { animation: toastIn  0.28s ease both; }
    .toast-out { animation: toastOut 0.28s ease both; }

    /* Print styles */
    @media print {
      .no-print { display: none !important; }
      header    { display: none !important; }
      body      { background: white; }
      .tab-in   { animation: none !important; }
      .print-header {
        display: flex !important;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.75rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid #1A1916;
      }
    }
    .print-header { display: none; }

    /* Mobile */
    @media (max-width: 600px) {
      .slider-row { flex-direction: column; align-items: stretch !important; gap: 0.5rem !important; }
      .slider-number-wrap { justify-content: flex-end; }
      .cta-row { flex-direction: column !important; }
      .cta-row a, .cta-row button { width: 100% !important; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ── Informa brand 2026 ────────────────────────────────────────────────────
    const PINK  = "#E85B7D";              // rosa på ljus yta
    const ROSA  = "#FA7896";              // accent på noir
    const INK   = "#1A1916";
    const INK2  = "#5C5852";
    const INK3  = "#8A8579";
    const CREAM = "#F1ECE3";
    const PAPER = "#FBF7EF";
    const NOIR  = "#1E1B19";
    const HAIR  = "rgba(26,25,22,0.14)";  // hårfin linje
    const HAIR2 = "rgba(26,25,22,0.08)";
    const GREEN = "#1A1916";              // fd. gröna siffror → ink
    const SERIF = "'Newsreader',serif";

    // Ordmärket "Informa." med rosa slutpunkt
    const Wordmark = ({ size = "1.6rem", color = INK, dot = PINK }) => (
      <span style={{ fontFamily:SERIF, fontWeight:400, fontSize:size, color, letterSpacing:"0.004em", lineHeight:1 }}>
        Informa<span style={{ color: dot }}>.</span>
      </span>
    );

    // ──────────────────────────────────────────────────────────────────────────
    const sek = (n) =>
      new Intl.NumberFormat("sv-SE").format(Math.round(n))
        .replace(/\u00a0|\u202f|\u2009/g, " ");

    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    // ────────── localStorage hook ────────────────────────────────────────────
    function useLS(key, init) {
      const [val, setVal] = useState(() => {
        try {
          const s = localStorage.getItem(key);
          return s !== null ? JSON.parse(s) : init;
        } catch { return init; }
      });
      const set = useCallback((v) => {
        setVal(v);
        try { localStorage.setItem(key, JSON.stringify(v)); } catch {}
      }, [key]);
      return [val, set];
    }

    // ────────── Count-up animation ──────────────────────────────────────────────
    function useCountUp(target, ms = 520) {
      const [val, setVal]  = useState(target);
      const fromRef        = useRef(target);
      const rafRef         = useRef(null);
      useEffect(() => {
        const from = fromRef.current, to = target, t0 = performance.now();
        cancelAnimationFrame(rafRef.current);
        const tick = (now) => {
          const p = Math.min((now - t0) / ms, 1);
          const e = 1 - Math.pow(1 - p, 3);
          setVal(Math.round(from + (to - from) * e));
          if (p < 1) rafRef.current = requestAnimationFrame(tick);
          else fromRef.current = to;
        };
        rafRef.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafRef.current);
      }, [target]);
      return val;
    }

    // ────────── Toast notification ─────────────────────────────────────────────
    function Toast({ msg, onDone }) {
      const [out, setOut] = useState(false);
      useEffect(() => {
        const t1 = setTimeout(() => setOut(true), 2200);
        const t2 = setTimeout(onDone, 2500);
        return () => { clearTimeout(t1); clearTimeout(t2); };
      }, []);
      return (
        <div className={out ? "toast-out" : "toast"} style={{
          position:"fixed", bottom:32, left:"50%", transform:"translateX(-50%)",
          background:NOIR, color:CREAM, padding:"0.7rem 1.5rem",
          borderRadius:"2px", fontSize:"0.9rem", fontWeight:500,
          zIndex:9999, whiteSpace:"nowrap"
        }}>{msg}</div>
      );
    }

    // ────────── SVG bar chart ──────────────────────────────────────────────────
    function BarChartSVG({ data }) {
      const [tip, setTip] = useState(null);
      const maxVal = Math.max(...data.map(d => d.value)) * 1.18 || 1;
      const W = 320, H = 140, PL = 52, PB = 26;
      const cW = W - PL - 8, cH = H - PB;
      const barW = 64, slot = cW / data.length;
      const yCoord = v => cH - (v / maxVal) * cH;
      const ticks = [0, 0.25, 0.5, 0.75, 1];
      const fmt = v => v === 0 ? "0" : v >= 1e6 ? `${(v/1e6).toFixed(1)}M` : `${Math.round(v/1e3)}k`;

      return (
        <div style={{ position:"relative", userSelect:"none" }}>
          <svg viewBox={`0 0 ${W} ${H + 8}`} style={{ width:"100%", height:"auto", display:"block" }}>
            {ticks.map((p, i) => {
              const v = maxVal * p, y = yCoord(v);
              return (
                <g key={i}>
                  <line x1={PL} y1={y} x2={W-8} y2={y} stroke="#E7E1D5" strokeWidth="1" />
                  <text x={PL-4} y={y+4} textAnchor="end" fontSize="9" fill={INK3} fontFamily="inherit">{fmt(v)}</text>
                </g>
              );
            })}
            {data.map((d, i) => {
              const cx = PL + slot * i + slot / 2;
              const bH = maxVal > 0 ? Math.max((d.value / maxVal) * cH, d.value > 0 ? 3 : 0) : 0;
              const by = yCoord(d.value);
              const isHov = tip === i;
              const color = i === 0 ? "#DAD3C6" : PINK;
              return (
                <g key={i} onMouseEnter={() => setTip(i)} onMouseLeave={() => setTip(null)} style={{ cursor:"default" }}>
                  <rect x={cx-barW/2} y={by} width={barW} height={bH} rx="2" fill={color}
                    opacity={isHov ? 0.82 : 1} style={{ transition:"opacity 0.15s" }} />
                  {isHov && (
                    <g>
                      <rect x={cx-44} y={by-28} width={88} height={22} rx="2"
                        fill={PAPER} stroke="#DAD3C6" strokeWidth="1" />
                      <text x={cx} y={by-13} textAnchor="middle" fontSize="10" fill={INK}
                        fontWeight="600" fontFamily="inherit">{sek(d.value)} kr</text>
                    </g>
                  )}
                  <text x={cx} y={H+4} textAnchor="middle" fontSize="11" fill={INK2} fontFamily="inherit">{d.name}</text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    }

    // ────────── Decorative background (borttagen – ren cream-yta per brand 2026) ─
    function BgCircles() {
      return null;
    }

    // ────────── Slider + editable number input ──────────────────────────────────
    function SliderInput({ label, value, min, max, step=1, onChange, suffix="" }) {
      const pct = max > min ? ((value - min) / (max - min)) * 100 : 0;
      const onNum = e => {
        const v = Number(e.target.value);
        if (!isNaN(v)) onChange(clamp(v, min, max));
      };
      return (
        <div style={{ marginBottom:"1.5rem" }}>
          <div style={{ marginBottom:"0.45rem" }}>
            <span style={{ fontSize:"0.84rem", fontWeight:500, color:INK2 }}>{label}</span>
          </div>
          <div className="slider-row" style={{ display:"flex", alignItems:"center", gap:"0.75rem" }}>
            <div style={{ flex:1 }}>
              <input type="range" min={min} max={max} step={step} value={value}
                onChange={e => onChange(Number(e.target.value))}
                className="informa-slider"
                style={{ background:`linear-gradient(to right,${PINK} ${pct}%,#DFD8CB ${pct}%)` }}
              />
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:"0.67rem", color:INK3, marginTop:"0.15rem" }}>
                <span>{sek(min)}{suffix==="%"?"%":""}</span>
                <span>{sek(max)}{suffix==="%"?"%":""}</span>
              </div>
            </div>
            <div className="slider-number-wrap" style={{ display:"flex", alignItems:"center", gap:"0.2rem", flexShrink:0 }}>
              <input type="number" value={value} min={min} max={max} step={step}
                onChange={onNum} onFocus={e => e.target.select()} className="no-spin"
                style={{
                  width: suffix==="kr" ? "7.5rem" : suffix==="mån" || suffix==="st/mån" ? "4rem" : "3.5rem",
                  padding:"0.35rem 0.5rem", borderRadius:"2px",
                  border:`1px solid ${HAIR}`, fontSize:"0.9rem",
                  fontWeight:600, color:PINK, textAlign:"right",
                  fontFamily:"inherit", background:PAPER,
                }}
              />
              {suffix && <span style={{ fontSize:"0.8rem", color:INK3, fontWeight:500, whiteSpace:"nowrap" }}>{suffix}</span>}
            </div>
          </div>
        </div>
      );
    }

    // ────────── Number input (free manual entry, no slider) ───────────────────
    function NumberInput({ label, value, onChange, suffix="", min, max, step=1, hint }) {
      const onNum = e => {
        const raw = e.target.value;
        if (raw === "") { onChange(0); return; }
        const v = Number(raw);
        if (isNaN(v)) return;
        let next = v;
        if (typeof min === "number") next = Math.max(min, next);
        if (typeof max === "number") next = Math.min(max, next);
        onChange(next);
      };
      return (
        <div style={{ marginBottom:"1.25rem" }}>
          <div style={{ marginBottom:"0.4rem", display:"flex", alignItems:"baseline", justifyContent:"space-between", gap:"0.5rem" }}>
            <span style={{ fontSize:"0.84rem", fontWeight:500, color:INK2 }}>{label}</span>
            {hint && <span style={{ fontSize:"0.7rem", color:INK3 }}>{hint}</span>}
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:"0.5rem" }}>
            <input
              type="number"
              value={value}
              step={step}
              onChange={onNum}
              onFocus={e => e.target.select()}
              className="no-spin"
              style={{
                flex: 1,
                maxWidth: "10rem",
                padding:"0.55rem 0.75rem",
                borderRadius:"2px",
                border:`1px solid ${HAIR}`,
                fontSize:"0.95rem",
                fontWeight:600,
                color:PINK,
                textAlign:"right",
                fontFamily:"inherit",
                background:PAPER,
              }}
            />
            {suffix && <span style={{ fontSize:"0.85rem", color:INK3, fontWeight:500, whiteSpace:"nowrap" }}>{suffix}</span>}
          </div>
        </div>
      );
    }

    // ────────── PIN screen with lockout ────────────────────────────────────────
    function PinScreen({ onUnlock }) {
      const [pin,       setPin]       = useState("");
      const [error,     setError]     = useState(false);
      const [shake,     setShake]     = useState(false);
      const [attempts,  setAttempts]  = useState(0);
      const [lockUntil, setLockUntil] = useState(0);
      const [now,       setNow]       = useState(Date.now());

      useEffect(() => {
        if (lockUntil <= Date.now()) return;
        const id = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(id);
      }, [lockUntil]);

      const locked   = now < lockUntil;
      const secsLeft = locked ? Math.ceil((lockUntil - now) / 1000) : 0;

      const tryUnlock = () => {
        if (locked) return;
        if (pin.trim() === "champions") {
          onUnlock();
        } else {
          const next = attempts + 1;
          setAttempts(next);
          setError(true); setShake(true); setPin("");
          setTimeout(() => setShake(false), 460);
          if (next >= 3) {
            setLockUntil(Date.now() + 30000);
            setAttempts(0);
            setNow(Date.now());
          }
        }
      };

      return (
        <div style={{ display:"flex", justifyContent:"center", alignItems:"center", minHeight:"68vh" }}>
          <div style={{
            background:PAPER, borderRadius:"4px", padding:"3rem 2.5rem",
            width:"100%", maxWidth:400, textAlign:"center",
            border:`1px solid ${HAIR}`,
            animation: shake ? "pinShake 0.46s ease" : "none",
          }}>
            <div style={{ marginBottom:"1.25rem" }}><Wordmark size="2.2rem" /></div>
            <div style={{ fontSize:"1.1rem", color:PINK, marginBottom:"1rem", lineHeight:1 }}>&#10022;</div>
            <h2 style={{ fontFamily:SERIF, fontSize:"1.5rem", fontWeight:400, color:INK, margin:"0 0 0.5rem" }}>
              Internt verktyg
            </h2>
            <p style={{ color:INK3, fontSize:"0.875rem", margin:"0 0 2rem" }}>Ange PIN-kod för att fortsätta</p>

            {locked ? (
              <div style={{ background:"#F5E9E5", border:"1px solid #DDBBB1", borderRadius:"2px", padding:"1.25rem", marginBottom:"1.25rem" }}>
                <p style={{ color:"#9C4F44", fontWeight:600, fontSize:"0.95rem", margin:"0 0 0.25rem" }}>För många försök</p>
                <p style={{ color:"#9C4F44", fontSize:"0.85rem", margin:0 }}>Försök igen om <strong>{secsLeft}</strong> sekunder</p>
              </div>
            ) : (
              <React.Fragment>
                <input
                  type="password" autoCapitalize="none" autoCorrect="off" autoComplete="off" spellCheck={false}
                  value={pin}
                  onChange={e => { setPin(e.target.value); setError(false); }}
                  onKeyDown={e => { if (e.key === "Enter") tryUnlock(); }}
                  placeholder="PIN-kod"
                  autoFocus
                  style={{
                    display:"block", width:"100%", padding:"0.9rem 1rem",
                    borderRadius:"2px",
                    border:`1px solid ${error ? "#9C4F44" : HAIR}`,
                    fontSize:"1.1rem", textAlign:"center", letterSpacing:"0.15em",
                    fontFamily:"inherit", outline:"none",
                    marginBottom: error ? "0.5rem" : "1.25rem",
                    boxSizing:"border-box", color:INK, background:"#fff",
                    transition:"border-color 0.2s",
                  }}
                />
                {error && (
                  <p style={{ color:"#9C4F44", fontSize:"0.8rem", margin:"0 0 1rem" }}>
                    Fel PIN-kod.{(3 - attempts) > 0 ? ` ${3 - attempts} försök kvar.` : ""}
                  </p>
                )}
              </React.Fragment>
            )}

            <button type="button" onClick={tryUnlock} disabled={locked}
              style={{
                width:"100%", padding:"0.9rem",
                background: locked ? "#CFC8BA" : NOIR,
                color:CREAM, border:"none",
                borderRadius:"2px", fontSize:"1rem", fontWeight:600,
                cursor: locked ? "not-allowed" : "pointer",
                fontFamily:"inherit",
                transition:"all 0.2s",
              }}
            >
              {locked ? `Låst ${secsLeft}s` : "Lås upp →"}
            </button>
          </div>
        </div>
      );
    }
    // ── External calculator ───────────────────────────────────────────────────
    function ExternalCalc() {
      const [extraMeet, setExtraMeet] = useLS("ext_extraMeet", 10);
      const [orderVal,  setOrderVal]  = useLS("ext_orderVal",  250000);
      const [closeRate, setCloseRate] = useLS("ext_closeRate", 15);
      const [email,     setEmail]     = useState("");
      const [submitted, setSubmitted] = useState(false);

      const extraMonthly = extraMeet * (closeRate / 100) * orderVal;
      const extraYearly  = extraMonthly * 12;
      const extraDealsYr = Math.round(extraMeet * (closeRate / 100) * 12);

      const aMonth = useCountUp(extraMonthly);
      const aYear  = useCountUp(extraYearly);
      const aDeals = useCountUp(extraDealsYr);

      const handleSubmit = (e) => {
        e.preventDefault();
        setSubmitted(true);
      };

      const card = {
        background:PAPER, borderRadius:"4px", padding:"1.875rem 2rem",
        border:`1px solid ${HAIR}`
      };

      return (
        <div>
          <div className="print-header">
            <Wordmark size="2rem" />
            <div style={{ fontSize:"1rem", color:INK2 }}>Mötesbokningskalkylator · {new Date().toLocaleDateString("sv-SE")}</div>
          </div>

          <div style={{ textAlign:"center", marginBottom:"2.75rem" }}>
            <h1 style={{ fontFamily:SERIF, fontSize:"clamp(1.85rem,5vw,3.1rem)",
              fontWeight:400, color:INK, margin:"0 0 1rem", lineHeight:1.15 }}>
              Räkna på vad bra <em style={{ fontStyle:"italic", color:PINK }}>mötesbokning</em><br />kan göra för dig
            </h1>
            <p style={{ color:INK2, fontSize:"1.05rem", maxWidth:540, margin:"0 auto", lineHeight:1.7 }}>
              Justera på slidrarna och se direkt vad fler kvalificerade säljmöten
              kan vara värda för ditt företag – per månad och per år.
            </p>
          </div>

          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(310px,1fr))", gap:"1.5rem", marginBottom:"2rem" }}>

            {/* ── Inputs ── */}
            <div style={card}>
              <h2 style={{ fontFamily:SERIF, fontWeight:400, fontSize:"1.25rem", color:INK, margin:"0 0 1.75rem" }}>
                Dina förutsättningar
              </h2>
              <SliderInput
                label="Extra möten per månad som Informa genererar"
                value={extraMeet} min={1} max={50} onChange={setExtraMeet} suffix="st" />
              <SliderInput
                label="Genomsnittligt ordervärde per affär"
                value={orderVal} min={0} max={2000000} step={5000} onChange={setOrderVal} suffix="kr" />
              <SliderInput
                label="Andel möten som leder till affär"
                value={closeRate} min={1} max={100} onChange={setCloseRate} suffix="%" />

              <div style={{ marginTop:"1.5rem", background:CREAM, borderRadius:"2px",
                padding:"1rem 1.125rem", border:`1px solid ${HAIR2}` }}>
                <p style={{ margin:0, fontSize:"0.8rem", color:INK2, lineHeight:1.6 }}>
                  <strong style={{ color:INK }}>Så här räknar vi:</strong><br />
                  {extraMeet} möten × {closeRate}% avslutningsgrad = <strong>{Math.round(extraMeet*(closeRate/100)*10)/10} nya affärer/mån</strong>
                  {" "}× {sek(orderVal)} kr = <strong style={{ color:PINK }}>{sek(extraMonthly)} kr/mån</strong>
                </p>
              </div>
            </div>

            {/* ── Results ── */}
            <div style={card}>
              <h2 style={{ fontFamily:SERIF, fontWeight:400, fontSize:"1.25rem", color:INK, margin:"0 0 1.5rem" }}>
                Din potential med Informa
              </h2>

              {/* Hero: yearly */}
              <div style={{ background:CREAM, border:`1px solid ${HAIR}`, borderRadius:"2px",
                padding:"1.5rem 1.75rem", marginBottom:"1rem", textAlign:"center" }}>
                <p style={{ margin:"0 0 0.3rem", fontSize:"0.72rem", color:PINK, fontWeight:600,
                  textTransform:"uppercase", letterSpacing:"0.06em" }}>Extra intäkter per år</p>
                <p style={{ margin:0, fontSize:"3rem", fontWeight:400, color:PINK, fontStyle:"italic",
                  letterSpacing:"-0.01em", fontFamily:SERIF, lineHeight:1.1 }}>
                  {sek(aYear)} kr
                </p>
              </div>

              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0.75rem", marginBottom:"1.5rem" }}>
                <div style={{ background:CREAM, borderRadius:"2px", padding:"1rem",
                  textAlign:"center", border:`1px solid ${HAIR2}` }}>
                  <p style={{ margin:"0 0 0.25rem", fontSize:"0.68rem", color:INK3,
                    fontWeight:600, textTransform:"uppercase", letterSpacing:"0.05em" }}>Per månad</p>
                  <p style={{ margin:0, fontSize:"1.45rem", fontWeight:400, fontFamily:SERIF, color:INK }}>{sek(aMonth)} kr</p>
                </div>
                <div style={{ background:CREAM, borderRadius:"2px", padding:"1rem",

    function InternalCalc() {

      const [meet,  setMeet]  = useLS("int_meet",   15);
      const [price, setPrice] = useLS("int_price", 3500);
      const [cCost, setCCost] = useLS("int_cCost", 1500);
      // Timbaserad
      const [hours, setHours] = useLS("int_hours",   20);
      const [hRate, setHRate] = useLS("int_hRate",  500);
      const [hCost, setHCost] = useLS("int_hCost",  250);
      const [toast, setToast] = useState(null);

  useEffect(() => {
    const _ps = new URLSearchParams(window.location.search);
    const _fn = _ps.get("foretag"), _bp = _ps.get("branch"), _sp = _ps.get("saljare");
    const _ri = ["IT/SaaS","Industri","Bygg","Rekrytering","Finans","Hälsa/Pharma","Media","Konsult","Annan"];
    if (_fn) setName(_fn);
    if (_sp) setSeller(_sp);
    if (_bp) { if (_ri.includes(_bp)) setBranch(_bp); else { const _k = _bp.toLowerCase().split("/")[0]; const _m = _ri.find(b => b.toLowerCase().includes(_k)); if (_m) setBranch(_m); } }
  }, []);

      const INDS = ["IT/SaaS","Industri","Bygg","Rekrytering","Finans","Hälsa/Pharma","Media","Konsult","Annan"];
      const isPM = priceModel === "per_meet";

      // ── Beräkningar ──────────────────────────────────────────────────────────
      const baseRev      = isPM ? meet * price          : hours * hRate;
      const baseCost     = isPM ? meet * cCost           : hours * hCost;
      const unitMargin   = isPM ? price - cCost          : hRate - hCost;
      const monthlyRev   = baseRev + techFee;
      const monthlyMargin= (baseRev - baseCost) + techFee;   // teknikavgift = 100% marginal
      const yearlyRev    = monthlyRev * 12;
      const contractVal  = monthlyRev * cLen + startCost;
      const contractMarg = monthlyMargin * cLen + startCost; // startcost antas 100% marginal
      const marginPct    = monthlyRev > 0 ? (monthlyMargin / monthlyRev) * 100 : 0;
      const unitLabel    = isPM ? "möte" : "timme";

      const score = marginPct >= 50
        ? { label:"Bra deal",  color:"#3E6B4A", bg:"#EDF2EA", border:"#C3D2BD" }
        : marginPct >= 30

          : { label:"Svag deal", color:"#9C4F44", bg:"#F5E9E5", border:"#DDBBB1" };

      const aMonth = useCountUp(monthlyRev);
      const aYear  = useCountUp(yearlyRev);
      const aCVal  = useCountUp(contractVal);
      const aUMarg = useCountUp(unitMargin);
      const aMMarg = useCountUp(monthlyMargin);
      const aCMarg = useCountUp(contractMarg);
      const aMPct  = useCountUp(marginPct);
      const aStart = useCountUp(startCost);

      const handleCopy = () => {

             "Kostnad/möte:       " + sek(cCost) + " kr"]

             "Timmar/månad:        " + hours + " tim",
             "Timpris:             " + sek(hRate) + " kr",
             "Kostnad/timme:       " + sek(hCost) + " kr"];
        const lines = [
          sep,
          "  INFORMA – Intern kalkylation",
          sep,
          name   ? ("Kund:                " + name)   : null,
          seller ? ("Säljare:             " + seller) : null,
          "Bransch:             " + branch,

          "Månadsintäkt:        " + sek(monthlyRev) + " kr",

          "Marginal/" + unitLabel + ":       " + sek(unitMargin) + " kr",

          "Deal Score: " + score.label,
          sep,

        navigator.clipboard.writeText(lines);

    // ──────────────────────── ROI + Graf ─────────────────────────────
    function GrafCalc() {
      const [extraMeet, setExtraMeet] = useLS("ext_extraMeet", 10);
      const [orderVal,  setOrderVal]  = useLS("ext_orderVal",  250000);
      const [closeRate, setCloseRate] = useLS("ext_closeRate", 15);
      const [renewal,   setRenewal]   = React.useState(70);
      const [yrs,       setYrs]       = React.useState(5);
      const [showAdv, setShowAdv] = React.useState(false);
      const [hover,     setHover]     = React.useState(null);

      const fmt  = n => new Intl.NumberFormat('sv-SE').format(Math.round(n));
      const fmtM = n => n>=1e9?(n/1e9).toFixed(1)+' mdr':n>=1e6?(n/1e6).toFixed(1)+' mkr':n>=1e3?Math.round(n/1e3)+'K':'0';

      const r         = renewal / 100;
      const annualNew = extraMeet * 12 * (closeRate / 100) * orderVal;

      const yearData = [];
      let cumul = 0;
      for (let y = 1; y <= yrs; y++) {
        const annualRev = r < 1 ? annualNew * (1 - Math.pow(r, y)) / (1 - r) : annualNew * y;
        cumul += annualRev;
        yearData.push({ year: y, annualRev, cumul });
      }

      const maxC = Math.max(yearData.length ? yearData[yearData.length-1].cumul * 1.12 : 1, 1);
      const W=720, H=300, PL=72, PR=32, PT=48, PB=44;
      const cW=W-PL-PR, cH=H-PT-PB;
      const xS = i => PL + (yrs>1 ? i/(yrs-1) : 0.5) * cW;
      const yS = v => PT + cH - (v/maxC)*cH;

      const pts = yearData.map((d,i) => ({ x:xS(i), y:yS(d.cumul), ...d }));
      const linePath = pts.map((p,i)=> i===0?`M ${p.x},${p.y}`:`L ${p.x},${p.y}`).join(' ');
      const areaPath = pts.length
        ? `M ${pts[0].x},${yS(0)} ${pts.map(p=>`L ${p.x},${p.y}`).join(' ')} L ${pts[pts.length-1].x},${yS(0)} Z`
        : '';

      const mult = yearData.length>=2 ? (yearData[yrs-1].annualRev/yearData[0].annualRev).toFixed(1) : '1.0';
      const totalVal = yearData.length ? yearData[yearData.length-1].cumul : 0;

      const sliders = [
        { label:'Extra möten / mån (Informa)',  val:extraMeet, set:setExtraMeet, min:1,  max:50,      step:1,     unit:'st', disp:v=>v },

        { label:'Avslutningsgrad',               val:closeRate, set:setCloseRate, min:1,  max:80,      step:1,     unit:'%',  disp:v=>v },
        { label:'Kundretention per år',          val:renewal,   set:setRenewal,   min:10, max:100,     step:5,     unit:'%',  disp:v=>v, adv:true },
        { label:'Tidshorisont',                  val:yrs,       set:setYrs,       min:2,  max:10,      step:1,     unit:'år', disp:v=>v },
      ];

      return (
        <div style={{ maxWidth:900, margin:'0 auto', padding:'2rem 0' }}>

          {/* Hero */}
          <div style={{ textAlign:'center', marginBottom:'2rem' }}>
            <div style={{ fontSize:'0.68rem', fontWeight:600, color:INK3, textTransform:'uppercase', letterSpacing:'0.18em', marginBottom:'0.6rem' }}>Total affärspotential med Informa</div>
            <div style={{ fontSize:'2.8rem', fontWeight:400, fontFamily:SERIF, color:INK, lineHeight:1, marginBottom:'0.4rem' }}>{fmt(totalVal)} kr</div>
            <div style={{ fontSize:'0.82rem', color:INK3 }}>Ackumulerat kundvärde efter {yrs} år &nbsp;·&nbsp; {mult}× intäktsökning från år 1</div>
          </div>

          {/* Cards */}
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'1rem', marginBottom:'2rem' }}>
            {[
              { top:PINK, label:'Nytt kundvärde / år', val:fmt(annualNew)+' kr', sub:'från Informas möten', c:PINK },
              { top:INK, label:'Ackumulerat efter år '+yrs, val:fmt(totalVal)+' kr', sub:'inkl. kundretention '+renewal+'%', c:INK },
              { top:INK, label:'Intäktsökning år 1 → '+yrs, val:mult+'×', sub:'ackumulerad tillväxt', c:INK },
            ].map((card,i) => (
              <div key={i} style={{ background:PAPER, borderRadius:'2px', padding:'1.2rem 1.4rem', borderTop:'2px solid '+card.top, border:`1px solid ${HAIR}`, borderTopWidth:'2px', borderTopColor:card.top, borderTopStyle:'solid' }}>
                <div style={{ fontSize:'0.62rem', textTransform:'uppercase', letterSpacing:'0.1em', color:INK3, marginBottom:'0.3rem' }}>{card.label}</div>
                <div style={{ fontSize:'1.45rem', fontWeight:400, fontFamily:SERIF, color:card.c, lineHeight:1.1 }}>{card.val}</div>
                <div style={{ fontSize:'0.68rem', color:INK3, marginTop:'0.15rem' }}>{card.sub}</div>
              </div>
            ))}
          </div>

          {/* Chart */}
          <div style={{ background:PAPER, borderRadius:'4px', padding:'1.5rem 1rem 0.5rem', border:`1px solid ${HAIR}`, marginBottom:'1.5rem' }}>
            <div style={{ display:'flex', alignItems:'center', gap:'1.5rem', paddingLeft:'1rem', marginBottom:'0.5rem' }}>
              <div style={{ display:'flex', alignItems:'center', gap:'0.4rem' }}>
                <div style={{ width:10, height:10, borderRadius:'50%', background:PINK }}/>
                <span style={{ fontSize:'0.7rem', color:INK3, fontWeight:500 }}>Med Informa</span>
              </div>
              <div style={{ display:'flex', alignItems:'center', gap:'0.4rem' }}>
                <div style={{ width:24, height:2, background:'#C9C2B4', borderRadius:2 }}/>
                <span style={{ fontSize:'0.7rem', color:INK3, fontWeight:500 }}>Utan retention</span>
              </div>
            </div>
            <svg viewBox={`0 0 ${W} ${H}`} style={{ width:'100%', height:'auto' }}>
              {[0,0.25,0.5,0.75,1].map((f,i) => {
                const v=maxC*f, yy=yS(v);
                return (
                  <g key={i}>
                    <line x1={PL} y1={yy} x2={W-PR} y2={yy} stroke={i===0?'#DAD3C6':'#EDE7DB'} strokeWidth="1"/>
                    {f>0 && <text x={PL-8} y={yy+4} textAnchor="end" fontSize="9.5" fill="#B5AE9F">{fmtM(v)}</text>}
                  </g>
                );
              })}
              <line x1={pts[0].x} y1={yS(annualNew)+1} x2={pts[pts.length-1].x} y2={yS(annualNew*yrs)+1} stroke="#C9C2B4" strokeWidth="1.5" strokeDasharray="5,4"/>
              <path d={areaPath} fill={PINK} opacity="0.06"/>
              <path d={linePath} fill="none" stroke={PINK} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
              {pts.map((p,i) => (
                <g key={i} style={{ cursor:'pointer' }} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)}>
                  <text x={p.x} y={p.y-16} textAnchor="middle" fontSize="10" fontWeight="600" fill={PINK}>{fmtM(p.cumul)}</text>
                  <text x={p.x} y={H-9} textAnchor="middle" fontSize="11" fill={INK3}>År {p.year}</text>
                  <circle cx={p.x} cy={p.y} r={hover===i?8:5.5} fill={PINK} stroke={CREAM} strokeWidth="2.5" style={{ transition:'r 0.12s' }}/>
                  {hover===i && (
                    <g>
                      <rect x={Math.min(p.x-84,W-PR-170)} y={p.y-96} width={168} height={72} rx="2"
                        fill={PAPER} stroke="#DAD3C6" strokeWidth="1"/>
                      <text x={Math.min(p.x,W-PR-86)} y={p.y-76} textAnchor="middle" fontSize="8.5" fill={INK3} fontWeight="600" letterSpacing="0.08em">ACKUMULERAT – ÅR {p.year}</text>
                      <text x={Math.min(p.x,W-PR-86)} y={p.y-54} textAnchor="middle" fontSize="15" fontWeight="600" fill={PINK}>{fmt(p.cumul)} kr</text>
                      <line x1={Math.min(p.x,W-PR-86)-50} y1={p.y-42} x2={Math.min(p.x,W-PR-86)+50} y2={p.y-42} stroke="#E7E1D5" strokeWidth="1"/>
                      <text x={Math.min(p.x,W-PR-86)} y={p.y-28} textAnchor="middle" fontSize="9.5" fill={INK2}>Årsintäkt: {fmt(p.annualRev)} kr</text>
                    </g>
                  )}
                </g>
              ))}
            </svg>
          </div>

          {/* Insight */}
          <div style={{ background:PAPER, border:`1px solid ${HAIR}`, borderLeft:`2px solid ${PINK}`, borderRadius:'2px', padding:'1.3rem 1.5rem', marginBottom:'1.5rem' }}>
            <div style={{ fontSize:'0.62rem', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.14em', color:PINK, marginBottom:'0.5rem' }}>Ackumulerad kundtillväxt</div>
            <p style={{ fontSize:'0.82rem', color:INK2, lineHeight:1.7, margin:0 }}>
              Med en kundretention på <strong>{renewal}%</strong> fortsätter varje kund ni vinner via Informa att generera intäkter år efter år – utan extra bearbetningskostnad.
              Det ackumulerade kundvärdet efter {yrs} år är <strong style={{ color:PINK }}>{fmt(totalVal)} kr</strong>, vilket är {mult}× mer än enbart år 1.
            </p>
          </div>

          {/* Sliders */}
          <div style={{ background:PAPER, borderRadius:'4px', padding:'1.5rem', border:`1px solid ${HAIR}` }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'1.3rem' }}><div style={{ fontSize:'0.68rem', fontWeight:600, color:INK3, textTransform:'uppercase', letterSpacing:'0.12em' }}>Antaganden</div><button onClick={()=>setShowAdv(v=>!v)} style={{ fontSize:'0.72rem', color:PINK, background:'none', border:'none', cursor:'pointer', padding:0, fontWeight:600 }}>{showAdv ? '▴ Dölj' : '▾ Avancerat'}</button></div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'1.1rem 3rem' }}>
              {sliders.filter(s=>!s.adv||showAdv).map((s,i) => (
                <div key={i}>
                  <div style={{ display:'flex', justifyContent:'space-between', marginBottom:'0.35rem' }}>
                    <span style={{ fontSize:'0.77rem', color:INK2 }}>{s.label}</span>
                    <span style={{ fontSize:'0.77rem', fontWeight:600, color:PINK }}>{s.disp(s.val)} {s.unit}</span>
                  </div>
                  <input type="range" min={s.min} max={s.max} step={s.step} value={s.val}
                    onChange={e => s.set(Number(e.target.value))}
                    style={{ width:'100%', accentColor:PINK }}/>
                </div>
              ))}
            </div>
          </div>

        </div>
      );
    }

    // ────────── App ────────────────────────────────────────────────────────────
    function App() {
      const [tab, setTab] = useState(() => { const _t = new URLSearchParams(window.location.search).get("tab"); return (_t === "internal" || _t === "external") ? _t : "external"; });
      const [pinOk, setPinOk] = useState(false);
      const [appUnlocked, setAppUnlocked] = useState(false);
      if (!appUnlocked) return <PinScreen onUnlock={() => { setAppUnlocked(true); setPinOk(true); }} />;

      return (
        <React.Fragment>
          <BgCircles />
          <div style={{ position:"relative", zIndex:1, minHeight:"100vh" }}>
            <header className="no-print" style={{ position:"sticky", top:0, zIndex:100,
              background:"rgba(241,236,227,0.92)",
              backdropFilter:"blur(20px)", WebkitBackdropFilter:"blur(20px)",
              borderBottom:`1px solid ${HAIR}` }}>
              <div style={{ maxWidth:1140, margin:"0 auto", padding:"0 1.5rem",
                height:68, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                <div style={{ userSelect:"none", lineHeight:0 }}>
                  <Wordmark size="1.65rem" />
                </div>
                <nav style={{ display:"flex", border:`1px solid ${HAIR}`, background:PAPER, borderRadius:"2px", padding:"3px", gap:"2px" }}>
                  {[{id:"external",label:"För kunder"},{id:"offer",label:"ROI-kalkyl"},{id:"graf",label:"ROI + graf"},{id:"internal",label:"Säljstöd"}].map(function(item) {
                    return (
                      <button key={item.id} type="button" onClick={() => setTab(item.id)}
                        style={{ padding:"0.45rem 1.25rem", borderRadius:"2px", border:"none",
                          cursor:"pointer", fontWeight:500, fontSize:"0.875rem", fontFamily:"inherit",
                          background: tab===item.id ? NOIR : "transparent",
                          color: tab===item.id ? CREAM : INK2,
                          transition:"all 0.2s" }}>
                        {item.label}
                      </button>
                    );
                  })}
                </nav>
              </div>
            </header>

            <main style={{ maxWidth:1140, margin:"0 auto", padding:"2.75rem 1.5rem 5rem" }}>
              {tab === "external" && (
                <div className="tab-in" key="ext"><ExternalCalc /></div>
              )}
              {tab === "offer" && (
                <div className="tab-in" key="off"><OfferCalc /></div>
              )}
          {tab === "graf" && (
            <div className="tab-in" key="graf"><GrafCalc /></div>
          )}
              {tab === "internal" && (
                <div className="tab-in" key="int">
                  <InternalCalc />
                </div>
              )}
            </main>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
